
name: Build Web APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: Website URL to wrap
        required: true
        type: string
      app_name:
        description: App display name
        required: true
        type: string
        default: Web App
      package_id:
        description: Android package ID
        required: true
        type: string
        default: com.prime.webapp

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate inputs
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_ID: ${{ inputs.package_id }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          from urllib.parse import urlparse

          u = urlparse(os.environ['WEBSITE_URL'].strip())
          if u.scheme not in ('http', 'https') or not u.netloc:
              sys.exit('website_url must be a valid http(s) URL')

          n = os.environ['APP_NAME'].strip()
          if not n or len(n) > 45:
              sys.exit('app_name must be 1-45 characters')

          p = os.environ['PACKAGE_ID'].strip()
          if not re.fullmatch(r'[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*){1,}', p):
              sys.exit('package_id is invalid')
          PY

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Prepare Android resources and app settings
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_ID: ${{ inputs.package_id }}
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import xml.sax.saxutils as xml

          res = 'android/app/src/main/res'

          # Remove previous empty or malformed generated resource folders.
          for name in os.listdir(res):
              if name.startswith('mipmap-') or name == 'values':
                  path = os.path.join(res, name)
                  if os.path.isdir(path):
                      shutil.rmtree(path)
                  else:
                      os.remove(path)

          # Recreate required resource folders.
          os.makedirs(os.path.join(res, 'values'), exist_ok=True)

          app_name = xml.escape(os.environ['APP_NAME'].strip())
          website_url = xml.escape(os.environ['WEBSITE_URL'].strip())

          strings = f'''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">{app_name}</string>
              <string name="website_url">{website_url}</string>
          </resources>
          '''

          with open(os.path.join(res, 'values', 'strings.xml'), 'w', encoding='utf-8') as f:
              f.write(strings)

          print('Android resource folders cleaned and prepared.')
          print('App name and website URL configured.')
          PY

      - name: Download favicon and generate launcher icons
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
        run: |
          python3 -m pip install --user Pillow

          python3 - <<'PY'
          import os
          import io
          import urllib.request
          from urllib.parse import urlparse
          from PIL import Image, ImageDraw

          website = os.environ['WEBSITE_URL'].strip()
          host = urlparse(website).hostname

          icon_url = f'https://www.google.com/s2/favicons?domain={host}&sz=256'

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          try:
              request = urllib.request.Request(
                  icon_url,
                  headers={'User-Agent': 'Mozilla/5.0'}
              )

              data = urllib.request.urlopen(request, timeout=20).read()
              icon = Image.open(io.BytesIO(data)).convert('RGBA')

              if icon.width < 32 or icon.height < 32:
                  raise ValueError('Icon image is too small')

              print('Website favicon downloaded successfully.')

          except Exception as error:
              print('Favicon download failed:', error)
              print('Creating fallback icon.')

              icon = Image.new(
                  'RGBA',
                  (256, 256),
                  (11, 17, 35, 255)
              )

              draw = ImageDraw.Draw(icon)

              draw.rounded_rectangle(
                  (20, 20, 236, 236),
                  radius=48,
                  fill=(105, 230, 245, 255)
              )

              draw.text(
                  (82, 105),
                  'WEB',
                  fill=(9, 13, 28, 255)
              )

          res = 'android/app/src/main/res'

          for folder, size in sizes.items():
              directory = os.path.join(res, folder)
              os.makedirs(directory, exist_ok=True)

              output = os.path.join(directory, 'ic_launcher.png')

              resized = icon.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              resized.save(output, format='PNG')

              print(f'Generated {output} ({size}x{size})')

          print('All launcher icons generated.')
          PY

      - name: Build debug APK
        env:
          PACKAGE_ID: ${{ inputs.package_id }}
        run: |
          cd android
          gradle --no-daemon -PappId="$PACKAGE_ID" assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
