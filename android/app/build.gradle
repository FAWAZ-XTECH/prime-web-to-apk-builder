plugins {
    id 'com.android.application'
}

android {
    namespace 'com.prime.webapk'
    compileSdk 35

    defaultConfig {
        applicationId project.hasProperty('appId') ? project.property('appId') : 'com.prime.webapp'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}
